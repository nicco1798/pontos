:root{
    --green:#006B5E;
    --green-light:#14A38B;
    --bg:#121212;
    --card:#1F1F1F;
    --text:#FFFFFF;
    --border:#2E2E2E;
}

*{
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

header{
    text-align:center;
    padding:20px;
}

.logo{
    width:90px;
    margin:auto;
}

.logo svg{
    width:100%;
    fill:var(--green-light);
}

h1{
    margin:10px 0;
    color:var(--green-light);
    letter-spacing:2px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.search-box{
    width:100%;
    padding:16px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#252525;
    color:white;
}

.search-box:focus{
    outline:none;
}

.button{
    margin-top:15px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    background:var(--green);
    color:white;
}

.card{
    margin-top:12px;
    padding:15px;
    background:var(--card);
    border-left:5px solid var(--green-light);
    border-radius:12px;
}

.alias{
    color:#cfcfcf;
    margin-bottom:5px;
}

.numero{
    font-size:22px;
    font-weight:bold;
    color:var(--green-light);
}

.hidden{
    display:none;
}

.rubrica-voci{
    margin-top:20px;
}

.voce{
    background:var(--card);
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

.voce strong{
    color:var(--green-light);
}

.info{
    margin-top:15px;
    color:#999;
    text-align:center;
}

</style>
</head>
